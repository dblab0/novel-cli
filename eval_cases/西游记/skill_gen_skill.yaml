    - '39': 孙悟空的法术，用手一指可使对方不能行动。他在乌鸡国金銮殿上定住了文武百官。
    - '54': 孙悟空的法术，可使众人身体不能动弹。本回中计划用定身法定住西梁女国君臣，待师徒西行一昼夜后再解术。
