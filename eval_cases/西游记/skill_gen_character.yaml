cases:
- id: SG-CHAR-001
  question: /skill:generate-character 检索西游记_人物_太上老君_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_太上老君_0
    entity_name: 太上老君
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_太上老君_0.md
    description_count: 22
    descriptions:
    - '5': 又称老君、道祖。居于兜率天宫离恨天。与燃灯古佛在三层高阁讲道，其丹房内有五个葫芦盛放九转金丹，被大圣偷吃。后向玉帝奏报金丹被盗。
    - '6': 又称老君，在灵霄殿与玉帝、王母同在，用金钢琢助二郎神打中猴王天灵。
    - '7': 三清之一，又称老君、太清道德天尊。居于兜率宫。向玉帝建议将悟空放入八卦炉煅炼，后悟空蹬倒炉子逃脱；曾抛金钢琢打中悟空。赴安天大会。
    - '8': 即太上老君，曾用火锻炼孙悟空（提及）。
    - '17': 又称道祖、老君，天庭仙祖，曾助二郎神用金刚琢打中孙悟空，并将孙悟空放入八卦炉中炼烧。
- id: SG-CHAR-002
  question: /skill:generate-character 检索西游记_人物_唐三藏_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_唐三藏_0
    entity_name: 唐三藏
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_唐三藏_0.md
    description_count: 91
    descriptions:
    - '11': 又称江流儿、玄奘法师。父亲陈光蕊，外公殷开山。自幼为僧，持斋受戒，精通佛法。被选为水陆大会高僧，受封左僧纲、右僧纲、天下大阐都僧纲之职。
    - '12': 大阐法师，又称玄奘、三藏、御弟圣僧、江流儿、金蝉子，主持水陆大会，被太宗赐予锦襕袈裟和九环锡杖，后发愿前往西天取经。
    - '13': 本名陈玄奘，又称玄奘、法师、圣僧、长老，大唐驾下钦差往西天拜佛求经的和尚，曾在化生寺对佛设下洪誓大愿。在双叉岭被寅将军等妖怪捉住，后被太白金星搭救，又得刘伯钦款待并护送。
    - '14': 又名陈玄奘、唐僧、三藏、长老，东土大唐派往西天取经的和尚，俗家姓陈，海州弘农郡聚贤庄人氏，被太宗赐号御弟三藏。收孙悟空为徒，性格慈悲但有些迂腐。
    - '15': 又称三藏、唐御弟、长老、师父、金蝉子等，东土大唐派往西天取经的圣僧，性格慈悲但有些软弱，面对失去白马而落泪，后得到龙马继续西行。
- id: SG-CHAR-003
  question: /skill:generate-character 检索西游记_人物_猪八戒_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_猪八戒_0
    entity_name: 猪八戒
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_猪八戒_0.md
    description_count: 83
    descriptions:
    - '8': 原为天蓬元帅，因戏弄嫦娥被贬下凡，错投猪胎，占据福陵山云栈洞，后受观音点化，法名猪悟能，等待取经人。
    - '18': 即猪八戒，住在福陵山云栈洞的妖精，自称姓猪，官名猪刚鬣，生得黑脸短毛、长喙大耳，会使风，有九齿钉钯，会天罡数变化，曾与九天荡魔祖师相识，被行者假扮翠兰探出底细。
    - '19': 原为天蓬元帅，因酒醉调戏嫦娥被贬下凡，错投猪胎，俗名猪刚鬣，住福陵山云栈洞。后受观音菩萨劝善，被唐僧收为徒弟，法名悟能，别名八戒。他使用九齿钉钯，曾与孙悟空大战，后烧毁云栈洞，跟随唐僧西行。
    - '20': 三藏的二徒弟，又称八戒、呆子、老猪。原在高老庄，受菩萨戒行，保唐僧西天取经。使用九齿钉钯，相貌丑陋，长嘴大耳。
    - '21': 又称八戒、呆子，唐僧的二徒弟，原为天蓬元帅，使九齿钉耙。本回中与孙悟空一起寻找师父，看守马匹行李，提醒孙悟空感恩太白金星。
- id: SG-CHAR-004
  question: /skill:generate-character 检索西游记_人物_如来佛祖_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_如来佛祖_0
    entity_name: 如来佛祖
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_如来佛祖_0.md
    description_count: 31
    descriptions:
    - '7': 即释迦牟尼尊者，西方极乐世界教主。应玉帝邀请前来收伏齐天大圣，与悟空打赌将其压于五行山下，并召开安天大会。又称佛祖、如来。
    - '8': 即佛祖，居住于灵山大雷音宝刹，曾降伏孙悟空，举办盂兰盆会，有三藏真经，派观音去东土寻取经人。又称我佛如来、佛祖。
    - '12': 又称如来佛，居于大西天天竺国大雷音寺，拥有大乘佛法三藏，派遣观世音菩萨到长安寻访取经人。
    - '14': 又称我佛如来、佛祖，将孙悟空压在五行山下，并留下金字压帖。
    - '17': 我佛如来，法力无边，将大闹天宫的孙悟空压在五行山下。
- id: SG-CHAR-005
  question: /skill:generate-character 检索西游记_人物_观世音菩萨_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_观世音菩萨_0
    entity_name: 观世音菩萨
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_观世音菩萨_0.md
    description_count: 45
    descriptions:
    - '6': 又称观音菩萨、菩萨，自王母娘娘请赴蟠桃大会，见瑶池荒凉，与众仙同去见玉帝，命惠岸行者下界打探军情，后又举荐二郎神擒拿妖猴，并欲用净瓶杨柳助战。
    - '7': 举荐二郎真君收伏悟空。文中提及。
    - '8': 又称观世音菩萨、大慈菩萨、南海菩萨，奉如来法旨上东土寻取经人，收服沙悟净、猪悟能、玉龙、孙悟空等，持有净瓶、杨柳枝等宝物。
    - '10': 又称女真人。住长安城都土地庙，用杨柳枝喝退泾河龙王，救脱皇帝。
    - '12': 又称菩萨、救苦救难观世音，奉如来佛旨到长安寻访取经人，变化为疥癞僧人，将锦襕袈裟和九环锡杖送给玄奘，后现出原身，指点大乘佛法。
- id: SG-CHAR-006
  question: /skill:generate-character 检索西游记_人物_沙悟净_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_沙悟净_0
    entity_name: 沙悟净
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_沙悟净_0.md
    description_count: 78
    descriptions:
    - '8': 原为灵霄殿卷帘大将，因失手打碎玻璃盏被贬流沙河，吃人度日，后受观音点化，法名沙悟净，等待取经人。
    - '22': 流沙河中的妖怪，原为天庭卷帘大将，又称卷帘将、卷帘大将、那怪、妖精、沙和尚。因失手打破玉玻璃被贬下界，在流沙河吃人为生。后被观音劝化，拜唐僧为师，法名沙悟净。
    - '23': 又称沙悟净、沙和尚。原为卷帘大将，随唐僧西行，忠厚老实，本回中拒绝招赘，坚持西行。
    - '24': 即沙悟净，唐僧的三徒弟。曾为卷帘大将，见过人参果但未曾吃过。在五庄观与行者、八戒分食人参果。
    - '25': 唐僧的三徒弟，又称沙僧、悟净。陪唐僧受绑，提醒师父还有陪绑的。
- id: SG-CHAR-007
  question: /skill:generate-character 检索西游记_人物_白龙马_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_白龙马_0
    entity_name: 白龙马
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_白龙马_0.md
    description_count: 34
    descriptions:
    - '8': 西海龙王敖闰之子，因纵火烧毁殿上明珠被玉帝吊打，后得观音相救，被送在深涧中等待变作白马作取经人脚力。又称小龙。
    - '15': 唐僧原本的坐骑，在鹰愁涧被玉龙三太子连鞍辔一口吞下。
    - '16': 唐僧的坐骑，被辟火罩保护。
    - '20': 三藏的坐骑，驮行李的白马。
    - '23': 原为西海龙王敖闰之子，因纵火烧明珠被罚，经观音菩萨点化变为白龙马，驮唐僧西行。本回中被孙悟空用金箍棒惊吓而快跑。
- id: SG-CHAR-008
  question: /skill:generate-character 检索西游记_人物_玉皇大帝_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_玉皇大帝_0
    entity_name: 玉皇大帝
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_玉皇大帝_0.md
    description_count: 33
    descriptions:
    - '1': 即玉帝，高天上圣大慈仁者，驾座金阙云宫灵霄宝店，被石猴目运金光惊动，垂赐恩慈称下方之物不足为异。文本中亦称玉帝。
    - '3': 天庭最高统治者，又称玉帝，高天上圣大慈仁者，驾坐金阙云宫灵霄宝殿，听取东海龙王与冥界奏表，准太白金星招安之策。
    - '4': 天庭的最高统治者，又称玉皇。垂帘听政，听从太白金星建议封孙悟空为弼马温，后因孙悟空反叛，派托塔李天王讨伐，最终接受太白金星建议封孙悟空为齐天大圣。
    - '5': 天庭的统治者，早朝时接受许旌阳真人建议，让齐天大圣管蟠桃园。后得知大圣偷桃偷酒盗丹，派四大天王、李天王等率十万天兵下界捉拿。
    - '6': 玉皇大帝，在通明殿、灵霄宝殿处理妖猴作乱之事，调遣天兵，接受观音举荐二郎神，后传旨将妖猴押至斩妖台。
- id: SG-CHAR-009
  question: /skill:generate-character 检索西游记_人物_孙悟空_0 相关信息后生成角色设定
  meta:
    entity_id: 西游记_人物_孙悟空_0
    entity_name: 孙悟空
    entity_type: 人物
    skill_type: generate-character
    output_path: characters/西游记_人物_孙悟空_0.md
    description_count: 94
    descriptions:
    - '1': 本为花果山上仙石所产石卵因风化作的石猴，五官俱全四肢皆备，目运金光射冲斗府。后在水帘洞被众猴拜为美猴王，享乐天真三五百载。为求长生不老，飘洋过海南赡部洲、西牛贺洲，最终在灵台方寸山斜月三星洞拜须菩提祖师为师，得法名孙悟空。文本中又称石猴、美猴王。
    - '2': 美猴王，又称悟空、猴王、大王，从菩提祖师学道，习得七十二般变化、筋斗云等神通，后回花果山打败混世魔王。
    - '3': 花果山水帘洞天生圣人，自称美猴王，又称悟空、老孙。精通七十二变、筋斗云等神通，强取东海龙宫如意金箍棒，大闹幽冥界勾销生死簿，后受玉帝招安上天。
    - '4': 本回主角，又称美猴王、悟空、猴王、齐天大圣、弼马温。原为花果山妖仙，被太白金星招安至天宫，先被封为弼马温，后因嫌官小反下天宫，自称齐天大圣。会筋斗云、三头六臂等神通，手持如意金箍棒。
    - '5': 本回主角，即孙悟空，又称大圣、猴王、老孙、美猴王。因无事闲游，玉帝命其权管蟠桃园。他偷吃蟠桃，又偷喝仙酒、盗取金丹，后反下天宫，在花果山与天兵天将交战。他拥有金箍棒，会定身法、筋斗云、分身法、隐身法等神通。
