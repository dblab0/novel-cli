    - '8': 猪悟能的兵器，九齿钉耙，又称钯。
    - '18': 猪刚鬣的兵器，他自称有九齿的钉钯，不怕法师和尚。
    - '19': 又称九齿钉钯，猪八戒的兵器。由神冰铁锻炼而成，老君动钤锤，荧惑添炭屑，五方五帝、六丁六甲参与铸造。上有九齿，双环金坠叶，名为上宝沁金钯，原为玉皇镇丹阙之物，赐给天蓬元帅。可随身变化，威力巨大。
    - '20': 猪悟能的武器，又称钉钯。
    - '21': 猪八戒的兵器九齿钉耙，本回中与孙悟空一起打死洞中妖狐等。
