    entity_type: 物品
    skill_type: generate-item
    output_path: items/西游记_物品_金箍棒_0.md
    description_count: 76
    descriptions:
    - '3': 天河定底神珍铁，重一万三千五百斤，两头金箍中间乌铁，上镌字。可随心意变化大小，原是大禹治水定江海浅深的定子，被孙悟空取为兵器。
    - '4': 孙悟空的兵器，也称金箍棒、铁棒。可从耳中取出，随意变化大小，重如泰山。孙悟空曾用它打败巨灵神和哪吒。
    - '5': 齐天大圣的兵器，又称如意棒。可从耳朵中掣出，幌一幌变成碗来粗细、丈二长短。大圣用它打退九曜星、战天神。
    - '6': 齐天大圣的兵器，又称如意棒、金箍棒、绣花针，是天河定底的神珍铁，可变化大小。
    - '7': 即如意金箍棒，悟空兵器。可从耳中掣出，迎风变碗口粗细，能变三条。
