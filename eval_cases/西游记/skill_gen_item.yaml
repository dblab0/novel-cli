    - '8': 沙悟净手持的宝杖，与木吒战斗。文本中称宝杖、降妖杖。
    - '22': 沙悟净的兵器，又称宝杖、降妖杖。原是月宫梭罗派吴刚伐下的桂枝，经鲁班制造，玉皇赐给卷帘大将。能降妖伏魔，可长可短。
    - '25': 沙和尚的兵器，与猪八戒、孙行者一起围攻镇元仙。
    - '28': 沙僧使用的兵器，即降妖宝杖，用于与黄袍怪交战。
    - '29': 沙悟净的兵器，降妖宝杖，用于战斗。
- id: SG-ITEM-002
  question: /skill:generate-item 检索西游记_物品_金箍棒_0 相关信息后生成物品设定
  meta:
    entity_id: 西游记_物品_金箍棒_0
