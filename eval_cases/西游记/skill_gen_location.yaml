    entity_type: 地点
    skill_type: generate-location
    output_path: locations/西游记_地点_灵霄宝殿_0.md
    description_count: 24
    descriptions:
    - '1': 玉皇大天尊玄穹高上帝驾座之处，众仙卿聚集之地。文本中写“灵霄宝店”，为天庭宫殿。
    - '3': 玉皇大天尊玄穹高上帝朝会的正殿，位于金阙云宫内，众仙卿在此议事。
    - '4': 天庭玉帝的朝堂，又称灵霄殿。金钉攒玉户，彩凤舞朱门，殿内有琉璃盘、太乙丹、玛瑙瓶、珊瑚树等。
    - '6': 玉帝处理政务的殿堂，天师邱弘济启知宣入菩萨，玉帝与众仙在此讲话。
    - '7': 玉帝朝殿，悟空在殿前与王灵官厮杀。又称灵霄殿。
- id: SG-LOC-004
