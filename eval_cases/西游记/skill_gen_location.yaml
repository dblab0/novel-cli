    entity_type: 地点
    skill_type: generate-location
    output_path: locations/西游记_地点_南天门_0.md
    description_count: 22
    descriptions:
    - '1': 天庭之门，玉帝命千里眼、顺风耳开南天门观看下界金光。
    - '3': 天庭的正门，太白金星领旨从此出天界前往花果山。
    - '4': 天宫的正门，碧沉沉琉璃造就，明幌幌宝玉妆成。增长天王率天将把守，孙悟空两次由此出入。
    - '6': 天宫之门，玉帝与众仙至此遥观下界战斗。
    - '8': 天庭的大门，观音与木吒曾到此见玉帝。
- id: SG-LOC-003
  question: /skill:generate-location 检索西游记_地点_灵霄宝殿_0 相关信息后生成地点设定
  meta:
    entity_id: 西游记_地点_灵霄宝殿_0
