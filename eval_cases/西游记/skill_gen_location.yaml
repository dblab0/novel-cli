- id: SG-LOC-001
  question: /skill:generate-location 检索西游记_地点_花果山_0 相关信息后生成地点设定
  meta:
    entity_id: 西游记_地点_花果山_0
    entity_name: 花果山
    entity_type: 地点
    skill_type: generate-location
    output_path: locations/西游记_地点_花果山_0.md
    description_count: 25
    descriptions:
    - '1': 东胜神洲傲来国近大海中的山，乃十洲之祖脉，三岛之来龙，山顶有仙石，产石猴。山中有水帘洞，为众猴安身之处。美猴王领群猴朝游花果山。
    - '2': 孙悟空的老家，位于东胜神洲傲来国，山中有水帘洞，群猴居住之地。
    - '3': 位于东胜神洲的名山，孙悟空的老家，有水帘洞、铁板桥，聚集四万七千余猴及七十二洞妖王。
    - '4': 孙悟空在人间的居所，山中有水帘洞，是猴群与各路妖王的聚集地。
    - '5': 齐天大圣下界为王的洞府所在。山前有天兵扎营围困，山中有水帘洞、铁板桥。四健将与七十二洞妖王在此演习武艺。
- id: SG-LOC-002
  question: /skill:generate-location 检索西游记_地点_南天门_0 相关信息后生成地点设定
  meta:
    entity_id: 西游记_地点_南天门_0
