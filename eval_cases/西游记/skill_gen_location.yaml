    entity_type: 地点
    skill_type: generate-location
    output_path: locations/西游记_地点_水帘洞_0.md
    description_count: 22
    descriptions:
    - '1': 花果山中的洞天福地，瀑布飞泉之后有铁板桥，桥那边有石房石碣，镌着“花果山福地，水帘洞洞天”。众猴随石猴进入，拜其为美猴王。
    - '2': 花果山中的洞府，孙悟空及其猴群的居住地，曾被混世魔王强占。
    - '3': 花果山内的洞府，孙悟空与众猴居住之处，有铁板桥通东海龙宫。
    - '4': 花果山内的洞府，孙悟空称王之所，洞天深处有宝位。巨灵神与哪吒曾到此挑战。
    - '5': 花果山中的洞府，大圣与众猴居住之处。天兵围困时，四健将与群猴深藏在水帘洞底。
