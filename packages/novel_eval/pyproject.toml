[project]
name = "novel-eval"
version = "0.1.0"
description = "Novel Agent 工具使用评估框架"
requires-python = ">=3.11"
dependencies = [
    "novel-cli",  # workspace 依赖
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",  # LLM API 调用（generator / judge）
    "jinja2>=3.1",  # 提示词模板渲染
    "tqdm>=4.66",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

[project.scripts]
novel-eval = "novel_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_eval"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"